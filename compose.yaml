x-image: &image
  image: ai-mechanic-fleet:local
  pull_policy: never

x-fleet: &fleet
  <<: *image
  user: ${FLEET_USER:-mechanic}
  env_file:
    - path: .env
      required: false
  environment:
    DATA_DIR: /fleet
    ARTIFACTS_DIR: /state
    ML_API_URL: ${ML_API_URL:-http://ml:8001}
    MAINTENANCE_API_URL: ${MAINTENANCE_API_URL:-http://maintenance:8002}
    RETRIEVAL_CONFIG_PATH: ${RETRIEVAL_CONFIG_PATH:-/app/configs/retrieval.yaml}
    WEB_RETRIEVAL_MODE: ${WEB_RETRIEVAL_MODE:-team}
    PLANNER_MODE: ${PLANNER_MODE:-local}
    AGENT_ARCHITECTURE: ${AGENT_ARCHITECTURE:-baseline}
  volumes:
    - type: bind
      source: ${FLEET_DIR:-./data}
      target: /fleet
      read_only: true
      bind:
        create_host_path: false
    - ${STATE_DIR:-state}:/state

x-mock: &mock
  <<: *image
  profiles: [mocks]
  restart: unless-stopped
  user: ${FLEET_USER:-mechanic}
  working_dir: /mocks
  volumes:
    - type: bind
      source: ${MOCK_DIR:-./data/mocks}
      target: /mocks
      read_only: true
      bind:
        create_host_path: false

services:
  index:
    <<: *fleet
    command: ["python", "-m", "ml.manual_corpus"]

  agent:
    <<: *fleet
    build:
      context: .
      target: agent
    restart: unless-stopped
    depends_on:
      index:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/fleet', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 10

  speech:
    build: ./app/speech
    restart: unless-stopped
    mem_limit: 896m

  web:
    environment:
      SPEECH_URL: ${SPEECH_URL:-http://speech:8003}
      AGENT_URL: ${AGENT_URL:-}
      WEB_AGENT_TIMEOUT: ${WEB_AGENT_TIMEOUT:-}
      LISTEN_ADDR: ":${WEB_LISTEN_PORT:-8080}"
    stop_grace_period: 30s
    build:
      context: .
      target: web
    user: ${FLEET_USER:-mechanic}
    volumes:
      - ${STATE_DIR:-state}:/state
    restart: unless-stopped
    depends_on:
      speech:
        condition: service_started
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:${WEB_LISTEN_PORT:-8080}"
    healthcheck:
      test: ["CMD", "mechanic", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml:
    <<: *mock
    command: ["uvicorn", "mock_ml.app:app", "--host", "0.0.0.0", "--port", "8001"]

  maintenance:
    <<: *mock
    command: ["uvicorn", "mock_toir.app:app", "--host", "0.0.0.0", "--port", "8002"]

volumes:
  state:
